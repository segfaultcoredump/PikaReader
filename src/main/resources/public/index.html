<html>
    <head>
        <title>PikaReader</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="/css/bootstrap-5.3.2.min.css" rel="stylesheet" >

        <link rel="stylesheet" href="/css/bootstrap-icons-1.9.1.css">
        <style>
            .form-control-sm {
                font-size: 1.25rem
            }
        </style>
    </head>
    <body>
        <!-- Bootstrap Bundle with Popper -->
        <script src="/js/bootstrap.bundle-5.3.2.min.js" ></script>
        <div  id="mainMenu"></div>
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <h1 class="display-3">PikaReader</h1>
                    <div class="display-6" id="unitID"></div>
                </div>
            </div>
            <!-- Start / Stop Reading Button -->
            <div class="row">
                <div class="d-grid gap-2 col-6 mx-auto py-2" id="readingButton"></div>
            </div>
            <!-- Reader Profile -->
            <div class="row">
                <div class="col-10 col-md-6 mx-auto py-2 text-center">
                    <label for="profileSelect" class="form-label display-8">Reader Profile</label>
                    <select class="form-select form-select-lg" id="profileSelect" aria-describedby="profileHelp" onchange="profileSelected()" disabled></select>
                    <div id="profileHelp" class="form-text"></div>
                </div>
            </div>
            <div class="row justify-content-center">
                <!-- Date / Time Block -->
                <div class="col-md-3 text-center">
                    <div class="display-6">Current Time</div>
                    <div class="display-8" id="date"></div>
                    <div class="display-8" id="time"></div>
                    <div class="display-10" id="timezone"></div>
                </div>
                <!-- Reader Status Block -->
                <div class="col-md-3 text-center">
                    <div class="display-6">Reader Status</div>
                    <div class="display-8" id="readerStatus"></div>
                    <div class="display-8" id="profileName"></div>
                    <div class="display-8" id="readRate"></div>
                </div>
            </div>

            <!-- Antenna Status Button  -->
            <div class="row">
                <div class="d-grid gap-2 col-6 mx-auto py-2" id="antennaStatus"></div>
            </div>

            <div class="row">
                <div class="d-grid gap-2 col-6 mx-auto py-2">
                    <button type="button" class="btn btn-primary btn-lg p-4" data-bs-toggle="modal" data-bs-target="#triggerModal" onClick="fireTrigger()">Trigger</button>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <div><hr></div>
                    <div class="display-10 p-1 text-center" id="connectionStatus"></div>
                    <div class="display-10 p-1 text-center"><A href="https://github.com/PikaTimer/PikaReader">PikaReader</A> v1.0</div>
                </div>
            </div>
        </div>

        <!-- Start Modal -->
        <div class="modal fade" id="startModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="staticBackdropLabel">Start Reader</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="display-8" id="startReaderBody">Starting Reader...</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stop Modal -->
        <div class="modal fade" id="stopModalPrompt" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="staticBackdropLabel">Stop Reader</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="display-8">Are you sure you want to stop the reader?</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#stopModal" onClick="stopReader()">Stop</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Really Stop Modal -->
        <div class="modal fade" id="stopModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="staticBackdropLabel">Stop Reader</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="display-8" id="stopReaderBody">Stopping Reader...</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Change Profile Prompt -->
        <div class="modal fade" id="profileModalPrompt" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="profilePromptLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="profilePromptLabel">Change Reader Profile</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onClick="cancelProfileChange()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="display-8" id="profilePromptBody"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onClick="cancelProfileChange()">Cancel</button>
                        <button type="button" class="btn btn-warning" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#profileModal" onClick="changeProfile()">Change Profile</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Change Profile Result -->
        <div class="modal fade" id="profileModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="profileModalLabel">Change Reader Profile</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="display-8" id="profileBody">Changing the reader profile...</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trigger Modal -->
        <div class="modal fade" id="triggerModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="staticBackdropLabel">Trigger</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="display-8" id="triggerBody">Creating a Trigger Time...</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // TODO:
            //      Gating, last read chip and time
            //      Uploader Status
            //      Battery, Lat/Long/Alt (if available)

            // do a search/replace for the various status variables
            var unitID = document.getElementById("unitID");
            var date = document.getElementById("date");
            var time = document.getElementById("time");
            var timezone = document.getElementById("timezone");
            var connectionStatus = document.getElementById("connectionStatus");
            var readingButton = document.getElementById("readingButton");
            var reading = false;
            var readerStatus = document.getElementById("readerStatus");
            var readRate = document.getElementById("readRate");
            var antennaStatus = document.getElementById("antennaStatus");
            var profileSelect = document.getElementById("profileSelect");
            var profileHelp = document.getElementById("profileHelp");
            var profileName = document.getElementById("profileName");
            var currentProfile = null;  // the profile id the server is using
            var profileNames = {};      // profile id -> display name
            var pendingProfile = null;  // a profile change waiting to be confirmed or applied
            var eventSocket = "ws://" + window.location.host + "/status";
            webSocket = new WebSocket(eventSocket);
            webSocket.onmessage = function (message) {
                const data = message.data;
                const status = JSON.parse(data);
                if (status.type === "STATUS") {
                    //console.log("Status Message");
                    //console.log(data);

                    // Date / Time Box
                    dateTime = status.localTime.split("T");
                    date.innerHTML = dateTime[0];
                    time.innerHTML = dateTime[1].replace(/\..*/, "");
                    timezone.innerHTML = status.timezone;
                    unitID.innerHTML = status.unitID;
                    reading = status.reading;
                    readRate.innerHTML = "Raw Reads/s " + status["Raw Tag Reads/s"];
                    if (reading) {
                        readingButton.innerHTML =
                                '<button type="button" class="btn btn-danger btn-lg p-4" data-bs-toggle="modal" data-bs-target="#stopModalPrompt">' +
                                'Stop Reader' +
                                '</button>';
                        antennaStatus.innerHTML = '<a href="/antennaStatus/"' +
                                '<button type="button" class="btn btn-info btn-lg p-4">' +
                                'Antenna Stats' +
                                '</button>' +
                                '</a>';
                    } else {
                        readingButton.innerHTML =
                                '<button type="button" class="btn btn-success btn-lg p-4" data-bs-toggle="modal" data-bs-target="#startModal" onClick="startReader()">' +
                                'Start Reader' +
                                '</button>';
                        antennaStatus.innerHTML = "";
                    }

                    // for each reader, loop and show the connected / disconnected status
                    // TODO: 
                    //      Show Disconnected, Connected, and Reading
                    //      Show reads/s and total reads
                    var readerStatusDisplay = "";
                    status.readers.forEach(function (r) {
                        readerStatusDisplay += "<div> " + r.name + ": ";
                        readerStatusDisplay += r.status;
                    });
                    readerStatus.innerHTML = readerStatusDisplay;

                    // Reader profile. Only touch the select when the profile
                    // changed, so an open dropdown isn't reset every second.
                    if (status.profile) {
                        profileName.textContent = "Profile: " + status.profile.name;
                        if (status.profile.id !== currentProfile && pendingProfile === null) {
                            currentProfile = status.profile.id;
                            if (profileNames[currentProfile] === undefined) {
                                loadProfiles();
                            } else {
                                profileSelect.value = currentProfile;
                            }
                        }
                    }
                    updateProfileControls();

                    connectionStatus.innerHTML = "Connected";
                }
            };
            webSocket.onclose = function () {
                connectionStatus.innerHTML = "Disconnected";
                // TODO: popup a modal dialog
            };
            function startReader() {
                console.log("Starting Reader...");
                //var data;
                fetch("http://" + window.location.host + "/start")
                        .then((response) => response.json())
                        .then((data) => {
                            var startReaderBody = document.getElementById("startReaderBody");
                            startReaderBody.innerHTML = "Reader started at " + data.timestamp;
                        });

            }

            function stopReader() {
                console.log("Stopping Reader...");
                var data;
                fetch("http://" + window.location.host + "/stop")
                        .then((response) => data = response.json())
                        .then((data) => {
                            var startReaderBody = document.getElementById("startReaderBody");
                            stopReaderBody.innerHTML = "Reader stopped at " + data.timestamp;
                        });

            }

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
            }

            function loadProfiles() {
                fetch("http://" + window.location.host + "/profiles")
                        .then((response) => response.json())
                        .then((data) => {
                            profileSelect.innerHTML = "";
                            data.profiles.forEach(function (p) {
                                profileNames[p.id] = p.name;
                                var option = document.createElement("option");
                                option.value = p.id;
                                option.textContent = p.name;
                                option.title = p.readFilter ? p.description + "\nRead filter: " + p.readFilter : p.description;
                                profileSelect.appendChild(option);
                            });
                            if (pendingProfile === null) {
                                currentProfile = data.current;
                            }
                            profileSelect.value = currentProfile;
                            updateProfileControls();
                        });
            }

            // The profile can only be changed while the reader is stopped
            function updateProfileControls() {
                profileSelect.disabled = reading || pendingProfile !== null || profileSelect.options.length === 0;
                profileHelp.textContent = reading ? "Stop the reader to change the profile" : "";
            }

            function profileSelected() {
                var selected = profileSelect.value;
                if (selected === currentProfile) {
                    return;
                }
                pendingProfile = selected;
                updateProfileControls();
                document.getElementById("profilePromptBody").innerHTML = "Change the reader profile from <b>" +
                        escapeHtml(profileNames[currentProfile]) + "</b> to <b>" + escapeHtml(profileNames[selected]) + "</b>?";
                bootstrap.Modal.getOrCreateInstance(document.getElementById("profileModalPrompt")).show();
            }

            function cancelProfileChange() {
                pendingProfile = null;
                profileSelect.value = currentProfile;
                updateProfileControls();
            }

            function changeProfile() {
                var target = pendingProfile;
                var profileBody = document.getElementById("profileBody");
                profileBody.textContent = "Changing the reader profile to " + profileNames[target] + "...";
                fetch("http://" + window.location.host + "/profile/" + encodeURIComponent(target), {method: "PUT"})
                        .then((response) => response.json().then((data) => ({ok: response.ok, data: data})))
                        .then((result) => {
                            if (result.ok) {
                                currentProfile = result.data.id;
                                var html = "Profile changed to <b>" + escapeHtml(result.data.name) + "</b> at<br> " + escapeHtml(result.data.timestamp);
                                // e.g. a reader model that isn't suited to this profile
                                var warnings = [];
                                (result.data.readers || []).forEach(function (r) {
                                    ((r.settings && r.settings.warnings) || []).forEach(function (w) {
                                        warnings.push(w);
                                    });
                                });
                                if (warnings.length > 0) {
                                    html += '<div class="alert alert-warning mt-3 mb-0">' + warnings.map(escapeHtml).join("<br>") + "</div>";
                                }
                                profileBody.innerHTML = html;
                            } else {
                                profileBody.textContent = "Unable to change the profile: " + result.data.error;
                            }
                        })
                        .catch((error) => {
                            profileBody.textContent = "Unable to change the profile: " + error;
                        })
                        .finally(() => {
                            pendingProfile = null;
                            profileSelect.value = currentProfile;
                            updateProfileControls();
                        });
            }

            loadProfiles();

            function fireTrigger() {
                console.log("firing a Trigger...");
                var data;
                fetch("http://" + window.location.host + "/trigger")
                        .then((response) => data = response.json())
                        .then((data) => {
                            var triggerBody = document.getElementById("triggerBody");
                            triggerBody.innerHTML = "Trigger Fired at<br> " + data.timestamp;
                        });

            }

        </script>

    </body>
</html>
